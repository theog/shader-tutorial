                <h1>Chapter 03: Shaping Functions — 2D WebGL GLSL Shader Tutorial</h1>
                <p>
                    Shaping functions are the fundamental mathematical building blocks of all procedural shader visuals. 
                    Each function reshapes a continuous 0.0–1.0 scalar input into a non-linear curve.
                </p>
                <h2>Key GLSL Shaping Functions Covered:</h2>
                <ul>
                    <li><strong>step(edge, x)</strong>: Binary threshold cutoff for sharp silhouettes and borders.</li>
                    <li><strong>smoothstep(edge0, edge1, x)</strong>: Cubic Hermite S-curve interpolation for smooth antialiased transitions.</li>
                    <li><strong>pow(x, exponent)</strong>: Power curve for brightness expansion, compression, and gamma adjustment.</li>
                    <li><strong>sin() / cos()</strong>: Continuous periodic trigonometric oscillations for wave motion.</li>
                    <li><strong>fract()</strong>: Modulo fractional repetition for sawtooth waves and spatial tiling.</li>
                    <li><strong>abs()</strong>: Fold symmetry and absolute value mirror reflections for triangle waveforms.</li>
                </ul>
